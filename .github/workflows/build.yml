name: Build Check

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 1.20.1-forge
            java: 17
            metadata: META-INF/mods.toml
            datagen: ":1.20.1-forge:runData"
          - target: 1.21.1-neoforge
            java: 21
            metadata: META-INF/neoforge.mods.toml
            datagen: ":1.21.1-neoforge:runData"
          - target: 26.1.2-neoforge
            java: 25
            metadata: META-INF/neoforge.mods.toml
            datagen: ":26.1.2-neoforge:runClientData :26.1.2-neoforge:runServerData"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run datagen
        run: ./gradlew ${{ matrix.datagen }} --console=plain
        env:
          CI: true

      - name: Check generated resources
        run: git diff --exit-code -- src/generated versions/${{ matrix.target }}/src/generated

      - name: Build
        run: ./gradlew ":${{ matrix.target }}:build" --console=plain
        env:
          CI: true

      - name: Inspect jar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          METADATA: ${{ matrix.metadata }}
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET"]
          metadata = os.environ["METADATA"]
          minecraft = target.rsplit("-", 1)[0]
          jar = Path("versions") / target / "build" / "libs" / f"logisticsnetworks-{target}-2.0.0.jar"
          if not jar.is_file():
              raise SystemExit(f"Missing artifact: {jar}")

          with zipfile.ZipFile(jar) as archive:
              names = set(archive.namelist())
              if metadata not in names:
                  raise SystemExit(f"Missing metadata: {metadata}")
              other = {"META-INF/mods.toml", "META-INF/neoforge.mods.toml"} - {metadata}
              if names.intersection(other):
                  raise SystemExit("Jar contains metadata for another loader")
              if "assets/logisticsnetworks/lang/en_us.json" not in names:
                  raise SystemExit("Missing shared language resources")
              descriptor = archive.read(metadata).decode("utf-8")
              if minecraft not in descriptor or 'version = "2.0.0"' not in descriptor:
                  raise SystemExit("Incorrect Minecraft or mod version metadata")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logisticsnetworks-${{ matrix.target }}-2.0.0
          path: versions/${{ matrix.target }}/build/libs/logisticsnetworks-${{ matrix.target }}-2.0.0.jar
