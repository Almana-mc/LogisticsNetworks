name: Release Build

on:
  workflow_dispatch:
    inputs:
      publish_github:
        description: "Publish the GitHub release"
        required: true
        type: boolean
        default: true
      publish_platforms:
        description: "Publish CurseForge and Modrinth entries"
        required: true
        type: boolean
        default: true
      confirm:
        description: "Type RELEASE to confirm"
        required: true
        type: string

concurrency:
  group: release-2.0.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'RELEASE'
        run: exit 1

  build:
    name: Build all targets
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew buildAll --console=plain
        env:
          CI: true

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: logisticsnetworks-2.0.0
          path: build/stonecutter-jars/*.jar

  github:
    name: Publish GitHub release
    needs: build
    if: inputs.publish_github
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: logisticsnetworks-2.0.0
          path: build/stonecutter-jars

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 2.0.0
          target_commitish: ${{ github.sha }}
          name: LogisticsNetworks 2.0.0
          body_path: CHANGELOGS/2.0.0.md
          files: build/stonecutter-jars/*.jar
          fail_on_unmatched_files: true

  platforms:
    name: Publish ${{ matrix.target }}
    needs: build
    if: inputs.publish_platforms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 1.20.1-forge
            minecraft: 1.20.1
            loader: forge
            java: 17
          - target: 1.21.1-neoforge
            minecraft: 1.21.1
            loader: neoforge
            java: 21
          - target: 26.1.2-neoforge
            minecraft: 26.1.2
            loader: neoforge
            java: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: logisticsnetworks-2.0.0
          path: build/stonecutter-jars

      - name: Resolve project identifiers
        id: projects
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CF_1201: ${{ vars.CURSEFORGE_PROJECT_ID_1_20_1_FORGE }}
          CF_1211: ${{ vars.CURSEFORGE_PROJECT_ID_1_21_1_NEOFORGE }}
          CF_2612: ${{ vars.CURSEFORGE_PROJECT_ID_26_1_2_NEOFORGE }}
          MR_1201: ${{ vars.MODRINTH_PROJECT_ID_1_20_1_FORGE }}
          MR_1211: ${{ vars.MODRINTH_PROJECT_ID_1_21_1_NEOFORGE }}
          MR_2612: ${{ vars.MODRINTH_PROJECT_ID_26_1_2_NEOFORGE }}
        run: |
          case "$TARGET" in
            1.20.1-forge) echo "curseforge=$CF_1201" >> "$GITHUB_OUTPUT"; echo "modrinth=$MR_1201" >> "$GITHUB_OUTPUT" ;;
            1.21.1-neoforge) echo "curseforge=$CF_1211" >> "$GITHUB_OUTPUT"; echo "modrinth=$MR_1211" >> "$GITHUB_OUTPUT" ;;
            26.1.2-neoforge) echo "curseforge=$CF_2612" >> "$GITHUB_OUTPUT"; echo "modrinth=$MR_2612" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish target
        if: steps.projects.outputs.curseforge != '' || steps.projects.outputs.modrinth != ''
        uses: Kira-NT/mc-publish@v3.3.0
        with:
          name: LogisticsNetworks 2.0.0 for ${{ matrix.target }}
          version: 2.0.0+${{ matrix.target }}
          version-type: release
          files: build/stonecutter-jars/logisticsnetworks-${{ matrix.target }}-2.0.0.jar
          changelog-file: CHANGELOGS/2.0.0.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          curseforge-id: ${{ steps.projects.outputs.curseforge }}
          curseforge-token: ${{ secrets.TOKEN_CURSEFORGE }}
          modrinth-id: ${{ steps.projects.outputs.modrinth }}
          modrinth-token: ${{ secrets.TOKEN_MODRINTH }}
